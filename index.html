
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#263a4b">
<title>빛이 잠긴 바다</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background: #102638;
  color: #edf0ee;
  font-family: "Noto Serif KR", serif;
}

button {
  font: inherit;
}

.world {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100svh;
  overflow: hidden;
  isolation: isolate;
  background: #293f50;
}

/* 하늘과 바다 명암 */

.world::before,
.world::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  pointer-events: none;
  z-index: 5;
}

.world::before {
  top: 0;
  height: 42%;
  background: linear-gradient(
    to bottom,
    rgba(218,228,231,.17),
    rgba(194,209,218,.08) 45%,
    transparent
  );
}

.world::after {
  bottom: 0;
  height: 48%;
  background: linear-gradient(
    to bottom,
    transparent,
    rgba(5,19,33,.15) 42%,
    rgba(3,12,25,.48)
  );
}

/* 풍경 */

.landscape {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

/* 해와 달 클릭 영역 */

.celestial {
  position: absolute;
  z-index: 10;
  display: block;
  padding: 0;
  margin: 0;
  border: none;
  outline: none;
  border-radius: 50%;
  background: transparent;
  box-shadow: none;
  appearance: none;
  -webkit-appearance: none;
  -webkit-tap-highlight-color: transparent;
  cursor: pointer;
}

.celestial:focus,
.celestial:active {
  outline: none;
  box-shadow: none;
}

.celestial:focus-visible {
  outline: 1px solid rgba(255,255,255,.8);
  outline-offset: 5px;
}

.sun-button {
  left: var(--sun-left);
  top: var(--sun-top);
  width: var(--sun-size);
  height: var(--sun-size);
}

.moon-button {
  left: var(--moon-left);
  top: var(--moon-top);
  width: var(--moon-size);
  height: var(--moon-size);
}

/* 해적선 클릭 영역 */

.ship-click {
  position: absolute;
  z-index: 11;
  left: var(--ship-left);
  top: var(--ship-top);
  width: var(--ship-width);
  height: var(--ship-height);

  transform: rotate(var(--ship-angle));
  transform-origin: 50% 100%;

  padding: 0;
  margin: 0;
  border: 0;
  outline: none;
  background: transparent;
  appearance: none;
  -webkit-appearance: none;
  -webkit-tap-highlight-color: transparent;
  cursor: pointer;
}

.ship-click:focus-visible {
  outline: 1px solid rgba(225,235,240,.8);
  outline-offset: 4px;
}

/* 제목 */

.scene-title {
  position: absolute;
  z-index: 12;
  top: 8%;
  left: 0;
  width: 100%;
  padding: 0 15px;
  margin: 0;
  text-align: center;
  pointer-events: none;

  font-size: clamp(18px, 2.4vw, 32px);
  font-weight: 300;
  letter-spacing: .25em;
  text-indent: .25em;

  color: #edf0ee;
  text-shadow: 0 2px 15px rgba(18,37,54,.7);
}

/* 애니메이션 */

.cloud-float-a {
  animation: driftA 45s ease-in-out infinite alternate;
}

.cloud-float-b {
  animation: driftB 60s ease-in-out infinite alternate;
}

.sun-glow {
  animation: sunGlow 10s ease-in-out infinite alternate;
}

.moon-glow {
  animation: moonGlow 12s ease-in-out infinite alternate;
}

.ship-sway {
  animation: sway 9s ease-in-out infinite alternate;
  transform-box: fill-box;
  transform-origin: 50% 100%;
}

@keyframes driftA {
  from { transform: translateX(-12px); }
  to { transform: translateX(38px); }
}

@keyframes driftB {
  from { transform: translateX(15px); }
  to { transform: translateX(-44px); }
}

@keyframes sunGlow {
  from { opacity: .72; }
  to { opacity: 1; }
}

@keyframes moonGlow {
  from { opacity: .65; }
  to { opacity: 1; }
}

@keyframes sway {
  from { transform: rotate(-.5deg); }
  to { transform: rotate(.5deg); }
}

/* 설명창 */

.modal {
  position: fixed;
  z-index: 30;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;

  background: rgba(5,14,26,.7);
  backdrop-filter: blur(9px);

  opacity: 0;
  visibility: hidden;
  pointer-events: none;

  transition:
    opacity .4s ease,
    visibility .4s ease;
}

.modal.open {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}

.profile {
  position: relative;
  width: min(390px, 100%);
  max-height: min(82svh, 650px);
  overflow: hidden;
  display: flex;
  flex-direction: column;

  border: 1px solid rgba(226,235,236,.23);
  background: #142636;
  box-shadow: 0 22px 70px rgba(4,12,23,.55);

  transform: translateY(14px);
  transition: transform .4s ease;
}

.modal.open .profile {
  transform: translateY(0);
}

/* 선장님 */

.profile.sun-profile {
  border-color: rgba(206,195,169,.3);
  background:
    radial-gradient(
      ellipse at 100% 0%,
      rgba(153,133,101,.12),
      transparent 60%
    ),
    linear-gradient(155deg,#303b43,#172632 80%);
}

/* 아귀인어 */

.profile.moon-profile {
  border-color: rgba(157,193,213,.27);
  background:
    radial-gradient(
      ellipse at 0% 100%,
      rgba(78,133,167,.16),
      transparent 65%
    ),
    linear-gradient(155deg,#1d3547,#0b1e30 85%);
}

/* 해적선 */

.profile.ship-profile {
  width: min(450px, 100%);
  border-color: rgba(177,194,207,.32);
  background:
    radial-gradient(
      ellipse at 100% 100%,
      rgba(64,99,125,.16),
      transparent 65%
    ),
    linear-gradient(150deg,#273746,#101e2d 85%);
}

/* 설명창 상단 */

.profile-header {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  padding: 18px 24px;
  border-bottom: 1px solid rgba(213,224,224,.16);
}

.profile-heading {
  margin: 0;
  font-size: 13px;
  font-weight: 400;
  letter-spacing: .18em;
  color: #a8b7c1;
}

.sun-profile .profile-heading {
  color: #b7aa98;
}

.moon-profile .profile-heading {
  color: #96b4c5;
}

.ship-profile .profile-heading {
  color: #9daeba;
}

.close-profile {
  padding: 0;
  border: none;
  background: transparent;
  color: #e8eff2;
  font-size: 26px;
  line-height: 1;
  cursor: pointer;
}

/* 설명창 본문 */

.profile-body {
  position: relative;
  padding: 35px 30px 42px;
  text-align: left;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: #536b7c transparent;
}

.profile-name {
  position: relative;
  z-index: 1;
  margin: 0;
  font-size: 27px;
  font-weight: 300;
  letter-spacing: .13em;
  color: #f3f5f4;
}

.profile-description {
  position: relative;
  z-index: 1;
  margin: 17px 0 0;
  font-size: 12px;
  font-weight: 400;
  line-height: 2.1;
  letter-spacing: .025em;
  color: #e3e9ec;
  word-break: keep-all;
}

.sun-profile .profile-description {
  color: #f0e4d2;
}

.moon-profile .profile-description {
  color: #dceef8;
}

.ship-profile .profile-description {
  color: #e0eaf0;
}

.profile-accent {
  width: 34px;
  height: 1px;
  margin-top: 26px;
  opacity: .85;
}

.sun-profile .profile-accent {
  background: linear-gradient(90deg,#d9c5a1,transparent);
}

.moon-profile .profile-accent {
  background: linear-gradient(90deg,#a6cde3,transparent);
}

.ship-profile .profile-accent {
  background: linear-gradient(90deg,#b5c5d1,transparent);
}

.profile-decoration {
  position: absolute;
  right: 27px;
  top: 29px;
  width: 58px;
  height: 58px;
  border-radius: 50%;
  pointer-events: none;
}

.sun-profile .profile-decoration {
  border: 1px solid rgba(224,204,163,.13);
  box-shadow:
    0 0 25px rgba(215,188,138,.07),
    inset 0 0 20px rgba(215,188,138,.04);
}

.moon-profile .profile-decoration {
  border: 1px solid rgba(180,218,240,.12);
  box-shadow:
    0 0 27px rgba(134,189,225,.09),
    inset 0 0 20px rgba(134,189,225,.04);
}

.ship-profile .profile-decoration {
  width: 70px;
  height: 70px;
  right: 22px;
  top: 24px;
  border: 1px solid rgba(178,201,218,.12);
  border-radius: 3px;
  transform: rotate(45deg);
}

/* 해적선 정보 */

.ship-info {
  margin-top: 29px;
}

.ship-info[hidden] {
  display: none;
}

.ship-section {
  margin-bottom: 28px;
}

.ship-section:last-child {
  margin-bottom: 0;
}

.ship-section-title {
  margin: 0 0 13px;
  padding-bottom: 11px;
  border-bottom: 1px solid rgba(194,213,224,.17);
  color: #e5eef3;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: .1em;
}

.ship-section-text {
  margin: 0;
  color: #e0eaf0;
  font-size: 12px;
  font-weight: 400;
  line-height: 2.2;
  word-break: keep-all;
}

.ship-info-row {
  display: flex;
  gap: 14px;
  margin: 10px 0;
  align-items: flex-start;
}

.ship-info-label {
  flex-shrink: 0;
  min-width: 54px;
  color: #aebfcb;
  font-size: 12px;
}

.ship-info-value {
  color: #e8eff3;
  font-size: 12px;
  line-height: 1.9;
}

/* 모바일 */

@media (max-width: 600px) {
  .scene-title {
    top: 10%;
    font-size: clamp(18px, 4.4vw, 25px);
    letter-spacing: .17em;
    text-indent: .17em;
  }

  .profile {
    width: min(350px, 100%);
  }

  .profile.ship-profile {
    width: min(390px, 100%);
  }

  .profile-body {
    padding: 30px 26px 37px;
  }

  .profile-name {
    font-size: 25px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>

<main class="world" id="world">

<svg

</svg>

<h1 class="scene-title">
  빛이 잠긴 바다
</h1>

<!-- 해 -->

<button
  class="celestial sun-button"
  id="sunButton"
  type="button"
  aria-label="선장님 정보 보기"
></button>

<!-- 달 -->

<button
  class="celestial moon-button"
  id="moonButton"
  type="button"
  aria-label="아귀인어 정보 보기"
></button>

<!-- 해적선 -->

<button
  class="ship-click"
  id="shipButton"
  type="button"
  aria-label="해적선 정보 보기"
></button>

<!-- 설명창 -->

<div
  class="modal"
  id="modal"
  aria-hidden="true"
>

  <section
    class="profile"
    id="profile"
    role="dialog"
    aria-modal="true"
    aria-labelledby="profileHeading"
  >

    <div class="profile-header">

      <h2
        class="profile-heading"
        id="profileHeading"
      ></h2>

      <button
        type="button"
        class="close-profile"
        id="closeProfile"
        aria-label="닫기"
      >×</button>

    </div>

    <div class="profile-body">

      <div
        class="profile-decoration"
        aria-hidden="true"
      ></div>

      <h3
        class="profile-name"
        id="profileName"
      ></h3>

      <p
        class="profile-description"
        id="profileDescription"
      ></p>

      <div
        class="profile-accent"
        aria-hidden="true"
      ></div>

      <!-- 해적선 전용 정보 -->

      <div
        class="ship-info"
        id="shipInfo"
        hidden
      >

        <section class="ship-section">

          <h4 class="ship-section-title">
            해적선 특징
          </h4>

          <div class="ship-info-row">
            <span class="ship-info-label">선장</span>
            <span class="ship-info-value">차태경</span>
          </div>

          <div class="ship-info-row">
            <span class="ship-info-label">소속</span>
            <span class="ship-info-value">
              차태경이 이끄는 해적단
            </span>
          </div>

          <p class="ship-section-text">
            이곳에 해적선의 외형, 구조, 특징,
            선원들의 생활 등에 관한 설명을 추가할 수 있습니다.
          </p>

        </section>

        <section class="ship-section">

          <h4 class="ship-section-title">
            페르소나 고정 정보
          </h4>

          <p class="ship-section-text">
            {{user}}는 이 해적선에 소속된 선원입니다.
            선내에서 맡은 직책과 역할은 자유롭게 설정할 수 있습니다.
          </p>

        </section>

      </div>

    </div>

  </section>

</div>

</main>

<script>
(() => {

  const world = document.getElementById("world");
  const scene = document.getElementById("landscape");
  const seaClipPath = document.getElementById("seaClipPath");

  const shipPosition = document.getElementById("shipPosition");
  const shipAngle = document.getElementById("shipAngle");
  const shipScale = document.getElementById("shipScale");

  const sunButton = document.getElementById("sunButton");
  const moonButton = document.getElementById("moonButton");
  const shipButton = document.getElementById("shipButton");

  const modal = document.getElementById("modal");
  const profile = document.getElementById("profile");

  const heading = document.getElementById("profileHeading");
  const name = document.getElementById("profileName");
  const description = document.getElementById("profileDescription");
  const shipInfo = document.getElementById("shipInfo");

  const closeButton = document.getElementById("closeProfile");

  let lastFocus = null;

  /* 풍경 배치 */

  function layout() {

    const w = world.clientWidth;
    const h = world.clientHeight;

    scene.setAttribute("viewBox", `0 0 ${w} ${h}`);

    const y1 = h * .205;
    const y2 = h * .795;
    const dy = y2 - y1;

    seaClipPath.setAttribute(
      "d",
      `M0 ${y1} L${w} ${y2} L${w} ${h} L0 ${h} Z`
    );

    /* 해와 달 */

    const sunX = w * .75;
    const sunY = h * .245;

    const moonX = w * .23;
    const moonY = h * .77;

    const r = Math.max(
      27,
      Math.min(53, Math.min(w, h) * .075)
    );

    const moonR = r * 1.05;

    function setCircle(id, x, y, radius) {
      const element = document.getElementById(id);
      element.setAttribute("cx", x);
      element.setAttribute("cy", y);
      element.setAttribute("r", radius);
    }

    setCircle("sunDiscShape", sunX, sunY, r);
    setCircle("sunAura", sunX, sunY, r * 4.1);

    setCircle("moonDiscShape", moonX, moonY, moonR);
    setCircle("moonAura", moonX, moonY, moonR * 4);

    world.style.setProperty("--sun-left", `${sunX - r}px`);
    world.style.setProperty("--sun-top", `${sunY - r}px`);
    world.style.setProperty("--sun-size", `${r * 2}px`);

    world.style.setProperty("--moon-left", `${moonX - moonR}px`);
    world.style.setProperty("--moon-top", `${moonY - moonR}px`);
    world.style.setProperty("--moon-size", `${moonR * 2}px`);

    /* ─────────────────────────
       해적선 : 수평선에 붙이기
    ───────────────────────── */

    const sx = w * .29;

    const horizonY = y1 + dy * .29;

    const angle =
      Math.atan2(dy, w) * 180 / Math.PI;

    const angleRad = angle * Math.PI / 180;

    const scale = Math.max(
      .42,
      Math.min(.88, Math.min(w / 850, h / 630))
    );

    /*
      배의 선체 아래쪽은 SVG 좌표 y=-5.
      수평선에 맞춰 기준점을 아래로 이동.
    */

    const shipY = horizonY + 5 * scale / Math.cos(angleRad);

    shipPosition.setAttribute(
      "transform",
      `translate(${sx} ${shipY})`
    );

    shipAngle.setAttribute(
      "transform",
      `rotate(${angle})`
    );

    shipScale.setAttribute(
      "transform",
      `scale(${scale})`
    );

    /*
      클릭 영역은 배와 동일한 회전·크기·기준점 사용.
      배의 실제 SVG 범위 x=-108~121, y=-185~-5.
    */

    const hitLeft = -112;
    const hitTop = -190;
    const hitWidth = 240;
    const hitHeight = 190;

    const hitCenterX = hitLeft + hitWidth / 2;

    /*
      클릭 영역의 회전 중심을 SVG의 원점과
      일치시키기 위해 transform-origin 조정.
    */

    const originX = -hitLeft;
    const originY = -hitTop;

    shipButton.style.left = `${sx + hitLeft * scale}px`;
    shipButton.style.top = `${shipY + hitTop * scale}px`;
    shipButton.style.width = `${hitWidth * scale}px`;
    shipButton.style.height = `${hitHeight * scale}px`;

    shipButton.style.transformOrigin =
      `${originX * scale}px ${originY * scale}px`;

    shipButton.style.transform = `rotate(${angle}deg)`;

  }

  /* 구름 */

  const clouds = [
    ...scene.querySelectorAll(".cloud-float-a, .cloud-float-b")
  ];

  function adaptClouds() {

    const w = world.clientWidth;
    const h = world.clientHeight;

    const scaleX = w / 1000;
    const scaleY = h / 700;

    for (const element of clouds) {
      element.style.transformBox = "view-box";
      element.style.transformOrigin = "0 0";
      element.style.scale = `${scaleX} ${scaleY}`;
    }

  }

  function refresh() {
    layout();
    adaptClouds();
  }

  window.addEventListener("resize", refresh);
  refresh();

  /* 캐릭터 정보 */

  const characters = {

    sun: {
      title: "선장님",
      name: "차태경",
      description: "태양의 힘을 잃어버린 해적선의 선장."
    },

    moon: {
      title: "아귀인어",
      name: "강지한",
      description: "깊은 바닷속에서 달의 힘을 품게 된 인어."
    },

    ship: {
      title: "해적선",
      name: "해적선",
      description: "끝없이 펼쳐진 바다를 항해하는 배."
    }

  };

  /* 설명창 */

  function openProfile(type) {

    const character = characters[type];

    lastFocus = document.activeElement;

    heading.textContent = character.title;
    name.textContent = character.name;
    description.textContent = character.description;

    profile.classList.remove(
      "sun-profile",
      "moon-profile",
      "ship-profile"
    );

    profile.classList.add(`${type}-profile`);

    shipInfo.hidden = type !== "ship";

    modal.classList.add("open");
    modal.setAttribute("aria-hidden", "false");

    closeButton.focus();

  }

  function closeProfile() {

    modal.classList.remove("open");
    modal.setAttribute("aria-hidden", "true");

    if (lastFocus) {
      lastFocus.focus();
    }

  }

  sunButton.addEventListener("click", () => {
    openProfile("sun");
  });

  moonButton.addEventListener("click", () => {
    openProfile("moon");
  });

  shipButton.addEventListener("click", () => {
    openProfile("ship");
  });

  closeButton.addEventListener("click", closeProfile);

  modal.addEventListener("click", event => {
    if (event.target === modal) {
      closeProfile();
    }
  });

  document.addEventListener("keydown", event => {

    if (!modal.classList.contains("open")) {
      return;
    }

    if (event.key === "Escape") {
      closeProfile();
    }

    if (event.key === "Tab") {
      event.preventDefault();
      closeButton.focus();
    }

  });

})();
</script>

</body>
</html>
