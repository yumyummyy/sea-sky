<html lang="ko">
<head>
<meta charset="UTF-8">

<title>빛이 잠긴 바다</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background: #102638;
  color: #edf0ee;
  font-family: "Noto Serif KR", serif;
}

button {
  font: inherit;
}

.world {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100svh;
  overflow: hidden;
  isolation: isolate;
  background: #293f50;
}

/* ─────────────────────────
   전체 풍경
───────────────────────── */

.landscape {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  pointer-events: none;
}

/* ─────────────────────────
   해와 달 클릭 영역
───────────────────────── */

.celestial {
  position: absolute;
  z-index: 10;
  display: block;
  padding: 0;
  margin: 0;
  border: none;
  outline: none;
  border-radius: 50%;
  background: transparent;
  box-shadow: none;
  appearance: none;
  -webkit-appearance: none;
  -webkit-tap-highlight-color: transparent;
  cursor: pointer;
}

.celestial::before,
.celestial::after {
  content: none;
}

.celestial:focus,
.celestial:active {
  outline: none;
  border: none;
  box-shadow: none;
}

.celestial:focus-visible {
  outline: 1px solid rgba(255,255,255,.7);
  outline-offset: 5px;
}

.sun-button {
  left: var(--sun-left);
  top: var(--sun-top);
  width: var(--sun-size);
  height: var(--sun-size);
}

.moon-button {
  left: var(--moon-left);
  top: var(--moon-top);
  width: var(--moon-size);
  height: var(--moon-size);
}

/* ─────────────────────────
   제목
───────────────────────── */

.scene-title {
  position: absolute;
  z-index: 12;
  top: 8%;
  left: 0;
  width: 100%;
  padding: 0 15px;
  margin: 0;
  text-align: center;
  pointer-events: none;

  font-size: clamp(18px, 2.4vw, 32px);
  font-weight: 300;
  letter-spacing: .25em;
  text-indent: .25em;

  color: #edf0ee;
  text-shadow: 0 2px 15px rgba(18,37,54,.7);
}

/* ─────────────────────────
   풍경 애니메이션
───────────────────────── */

.cloud-float-a {
  animation: driftA 45s ease-in-out infinite alternate;
}

.cloud-float-b {
  animation: driftB 60s ease-in-out infinite alternate;
}

.sun-glow {
  animation: sunGlow 10s ease-in-out infinite alternate;
}

.moon-glow {
  animation: moonGlow 12s ease-in-out infinite alternate;
}

.ship-sway {
  animation: sway 9s ease-in-out infinite alternate;
  transform-box: fill-box;
  transform-origin: 50% 100%;
}

@keyframes driftA {
  from { transform: translateX(-12px); }
  to { transform: translateX(38px); }
}

@keyframes driftB {
  from { transform: translateX(15px); }
  to { transform: translateX(-44px); }
}

@keyframes sunGlow {
  from { opacity: .72; }
  to { opacity: 1; }
}

@keyframes moonGlow {
  from { opacity: .65; }
  to { opacity: 1; }
}

@keyframes sway {
  from { transform: rotate(-.5deg); }
  to { transform: rotate(.5deg); }
}

/* ─────────────────────────
   설명창 공통
───────────────────────── */

.modal {
  position: fixed;
  z-index: 30;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;

  background: rgba(5,14,26,.7);
  backdrop-filter: blur(9px);

  opacity: 0;
  visibility: hidden;
  pointer-events: none;

  transition:
    opacity .4s ease,
    visibility .4s ease;
}

.modal.open {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}

.profile {
  position: relative;
  width: min(390px, 100%);
  overflow: hidden;

  border: 1px solid rgba(226,235,236,.23);
  background: #142636;
  box-shadow: 0 22px 70px rgba(4,12,23,.55);

  transform: translateY(14px);
  transition: transform .4s ease;
}

.modal.open .profile {
  transform: translateY(0);
}

/* 선장님 창 */

.profile.sun-profile {
  border-color: rgba(206,195,169,.3);

  background:
    radial-gradient(
      ellipse at 100% 0%,
      rgba(153,133,101,.12),
      transparent 60%
    ),
    linear-gradient(
      155deg,
      #303b43,
      #172632 80%
    );
}

/* 아귀인어 창 */

.profile.moon-profile {
  border-color: rgba(157,193,213,.27);

  background:
    radial-gradient(
      ellipse at 0% 100%,
      rgba(78,133,167,.16),
      transparent 65%
    ),
    linear-gradient(
      155deg,
      #1d3547,
      #0b1e30 85%
    );
}

/* 설명창 상단 */

.profile-header {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 24px;

  border-bottom: 1px solid rgba(213,224,224,.16);
}

.profile-heading {
  margin: 0;
  font-size: 13px;
  font-weight: 400;
  letter-spacing: .18em;
  color: #dce5e7;
}

.sun-profile .profile-heading {
  color: #ded0b7;
}

.moon-profile .profile-heading {
  color: #b9d6e7;
}

.close-profile {
  padding: 0;
  border: none;
  background: transparent;
  color: #dce4e5;
  font-size: 26px;
  line-height: 1;
  cursor: pointer;
}

/* 설명창 본문 */

.profile-body {
  position: relative;
  padding: 35px 30px 42px;
  text-align: left;
}

.profile-name {
  margin: 0;
  font-size: 27px;
  font-weight: 300;
  letter-spacing: .13em;
  color: #edf0ee;
}

.profile-description {
  margin: 17px 0 0;
  font-size: 12px;
  font-weight: 300;
  line-height: 2;
  letter-spacing: .025em;
  color: #bdc9cf;
  word-break: keep-all;
}

.sun-profile .profile-description {
  color: #c9c2b6;
}

.moon-profile .profile-description {
  color: #b5cad8;
}

/* 이름 아래 작은 장식 */

.profile-accent {
  width: 34px;
  height: 1px;
  margin-top: 26px;
  opacity: .75;
}

.sun-profile .profile-accent {
  background: linear-gradient(
    90deg,
    #d9c5a1,
    transparent
  );
}

.moon-profile .profile-accent {
  background: linear-gradient(
    90deg,
    #a6cde3,
    transparent
  );
}

/* 창 내부의 은은한 장식 */

.profile-decoration {
  position: absolute;
  right: 27px;
  top: 29px;
  width: 58px;
  height: 58px;
  border-radius: 50%;
  pointer-events: none;
}

.sun-profile .profile-decoration {
  border: 1px solid rgba(224,204,163,.13);
  box-shadow:
    0 0 25px rgba(215,188,138,.07),
    inset 0 0 20px rgba(215,188,138,.04);
}

.moon-profile .profile-decoration {
  border: 1px solid rgba(180,218,240,.12);
  box-shadow:
    0 0 27px rgba(134,189,225,.09),
    inset 0 0 20px rgba(134,189,225,.04);
}

/* ─────────────────────────
   모바일
───────────────────────── */

@media (max-width: 600px) {
  .scene-title {
    top: 10%;
    font-size: clamp(18px, 4.4vw, 25px);
    letter-spacing: .17em;
    text-indent: .17em;
  }

  .profile {
    width: min(350px, 100%);
  }

  .profile-body {
    padding: 30px 26px 37px;
  }

  .profile-name {
    font-size: 25px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<script>
(() => {

  const world = document.getElementById("world");
  const scene = document.getElementById("landscape");

  const seaClipPath = document.getElementById("seaClipPath");

  const shipPosition = document.getElementById("shipPosition");
  const shipAngle = document.getElementById("shipAngle");
  const shipScale = document.getElementById("shipScale");

  const sunButton = document.getElementById("sunButton");
  const moonButton = document.getElementById("moonButton");

  const modal = document.getElementById("modal");
  const profile = document.getElementById("profile");

  const heading = document.getElementById("profileHeading");
  const name = document.getElementById("profileName");
  const description = document.getElementById("profileDescription");

  const closeButton = document.getElementById("closeProfile");

  let lastFocus = null;

  /* ─────────────────────────
     화면 크기에 따른 풍경 배치
  ───────────────────────── */

  function layout() {

    const w = world.clientWidth;
    const h = world.clientHeight;

    scene.setAttribute(
      "viewBox",
      `0 0 ${w} ${h}`
    );

    /* 기울어진 하늘과 바다 */

    const y1 = h * .205;
    const y2 = h * .795;
    const dy = y2 - y1;

    seaClipPath.setAttribute(
      "d",
      `M0 ${y1} L${w} ${y2} L${w} ${h} L0 ${h} Z`
    );

    /* 해와 달 */

    const sunX = w * .75;
    const sunY = h * .245;

    const moonX = w * .23;
    const moonY = h * .77;

    const r = Math.max(
      27,
      Math.min(53, Math.min(w, h) * .075)
    );

    const moonR = r * 1.05;

    function setCircle(id, x, y, radius) {

      const element = document.getElementById(id);

      element.setAttribute("cx", x);
      element.setAttribute("cy", y);
      element.setAttribute("r", radius);

    }

    /* 태양 */

    setCircle(
      "sunDiscShape",
      sunX,
      sunY,
      r
    );

    setCircle(
      "sunAura",
      sunX,
      sunY,
      r * 4.1
    );

    /* 달 */

    setCircle(
      "moonDiscShape",
      moonX,
      moonY,
      moonR
    );

    setCircle(
      "moonAura",
      moonX,
      moonY,
      moonR * 4
    );

    /* 해 클릭 영역 */

    world.style.setProperty(
      "--sun-left",
      `${sunX - r}px`
    );

    world.style.setProperty(
      "--sun-top",
      `${sunY - r}px`
    );

    world.style.setProperty(
      "--sun-size",
      `${r * 2}px`
    );

    /* 달 클릭 영역 */

    world.style.setProperty(
      "--moon-left",
      `${moonX - moonR}px`
    );

    world.style.setProperty(
      "--moon-top",
      `${moonY - moonR}px`
    );

    world.style.setProperty(
      "--moon-size",
      `${moonR * 2}px`
    );

    /* 해적선 */

    const sx = w * .29;
    const sy = y1 + dy * .29;

    const angle =
      Math.atan2(dy, w) * 180 / Math.PI;

    const scale = Math.max(
      .42,
      Math.min(.88, Math.min(w / 850, h / 630))
    );

    shipPosition.setAttribute(
      "transform",
      `translate(${sx} ${sy})`
    );

    shipAngle.setAttribute(
      "transform",
      `rotate(${angle})`
    );

    shipScale.setAttribute(
      "transform",
      `scale(${scale})`
    );

  }

  /* ─────────────────────────
     구름 비율
  ───────────────────────── */

  const clouds = [
    ...scene.querySelectorAll(
      ".cloud-float-a, .cloud-float-b"
    )
  ];

  function adaptClouds() {

    const w = world.clientWidth;
    const h = world.clientHeight;

    const scaleX = w / 1000;
    const scaleY = h / 700;

    for (const element of clouds) {

      element.style.transformBox = "view-box";
      element.style.transformOrigin = "0 0";

      element.style.scale = `${scaleX} ${scaleY}`;

    }

  }

  function refresh() {
    layout();
    adaptClouds();
  }

  window.addEventListener("resize", refresh);

  refresh();

  /* ─────────────────────────
     캐릭터 설명창
  ───────────────────────── */

  const characters = {

    sun: {
      title: "선장님",
      name: "차태경",
      description: "태양의 힘을 잃어버린 해적선의 선장."
    },

    moon: {
      title: "아귀인어",
      name: "강지한",
      description: "깊은 바닷속에서 달의 힘을 품게 된 인어."
    }

  };

  function openProfile(type) {

    const character = characters[type];

    lastFocus = document.activeElement;

    heading.textContent = character.title;
    name.textContent = character.name;
    description.textContent = character.description;

    profile.classList.remove(
      "sun-profile",
      "moon-profile"
    );

    profile.classList.add(
      type === "sun"
        ? "sun-profile"
        : "moon-profile"
    );

    modal.classList.add("open");

    modal.setAttribute(
      "aria-hidden",
      "false"
    );

    closeButton.focus();

  }

  function closeProfile() {

    modal.classList.remove("open");

    modal.setAttribute(
      "aria-hidden",
      "true"
    );

    if (lastFocus) {
      lastFocus.focus();
    }

  }

  sunButton.addEventListener("click", () => {
    openProfile("sun");
  });

  moonButton.addEventListener("click", () => {
    openProfile("moon");
  });

  closeButton.addEventListener(
    "click",
    closeProfile
  );

  modal.addEventListener("click", event => {

    if (event.target === modal) {
      closeProfile();
    }

  });

  document.addEventListener("keydown", event => {

    if (!modal.classList.contains("open")) {
      return;
    }

    if (event.key === "Escape") {
      closeProfile();
    }

    if (event.key === "Tab") {
      event.preventDefault();
      closeButton.focus();
    }

  });

})();
</script>

</body>
</html>
